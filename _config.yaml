# site properties and page defaults
title: Machine Learning for Precision Neuropsychiatry
subtitle: ML4PNP
description: ML4PNP at Tilburg University develops normative brain models and open-source EEG, MEG, and MRI tools for research in precision neuropsychiatry.
url: https://ml4pnp.github.io
baseurl: ""
social_image: images/share.jpg

# Shared identity for search engines and sharing previews.
organization:
  logo: images/logo.png
  parent_name: Tilburg University
  parent_url: https://www.tilburguniversity.edu/
  same_as:
    - https://github.com/ML4PNP

# Paste only the content value of Google's verification tag here.
google_site_verification: ""
header: images/background.png
footer: images/background.png
proofer: false

# site social media and other links
links:
  email: s.m.kia@tilburguniversity.edu
  github: ML4PNP
  #twitter: ML4PNP
  #youtube: ML4PNP

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
