<header class="background">
  <a href="{{ '/' | relative_url }}" class="home" aria-label="ML4PNP home">
    <img src="{{ '/images/lab-mark.webp' | relative_url }}" width="40" height="40" alt="">
    <strong>{{ site.subtitle }}</strong>
  </a>

  <input class="nav-toggle" type="checkbox" aria-label="Show navigation" aria-controls="main-navigation">

  <nav id="main-navigation" aria-label="Main navigation">
    {% assign pages = site.pages
      | where_exp: "page", "page.nav"
      | sort: "nav.order"
    %}
    {% for page in pages %}
      {% if page.nav %}
        <a
          href="{{ page.dir | relative_url | uri_escape }}"
          data-tooltip="{{ page.nav.tooltip | xml_escape }}"
        >
          {{ page.title }}
        </a>
      {% endif %}
    {% endfor %}
  </nav>
  <select id="theme-choice" aria-label="Colour theme">
    <option value="auto">Auto</option>
    <option value="day">Day</option>
    <option value="dark">Dark</option>
  </select>
</header>
